<section id="card" class="p-5" lang="en-GB">
  <header >
    <h1>WCAG 2.2. Client Side Script Techniques</h1>
  </header>
  <article class="card-body">
    <table id="table" class="table table-responsive pt-5" width="100%">
      <thead class="main-color">
        <tr>
          <th scope="col">Technique</th>
          <th scope="col">Description</th>
          <th scope="col">Test</th>
        </tr>
      </thead>
    </table>
  </article>
</section>

<script>
  $(document).ready(function () {
    let table = $('#table').DataTable({
      info: true,
      paging: false,
      ordering: true,
      searching: false,
      dom:  '<"row py-3" <"col-sm-12 col-md-6" i> <"col-sm-12 col-md-6" f> >' +
            '<"row" <"col-sm-12" t> >' +
            '<"row py-3" <"col-sm-12 col-md-6" i> >',
      ajax: './assets/wcag/client-side-script-techniques.json',
      columns: [
        { data: 'url', render: function (data, type, row, meta) { return '<a href="' + data + '">' + row.technique + '</a>'; }, },
        { data: 'description' },
        { data: 'tests' }
      ],
    });
  });
</script>
