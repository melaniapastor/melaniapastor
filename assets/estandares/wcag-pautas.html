<section id="card">
  <header>
    <h1>WCAG - Pautas</h1>
  </header>
  <article class="card-body">
    <table id="table" class="table table-responsive pt-5" width="100%">
      <thead class="main-color">
        <tr>
          <th scope="col">Número</th>
          <th scope="col">Principio</th>
          <th scope="col">Content</th>
        </tr>
      </thead>
    </table>
  </article>
</section>

<script>
  $(document).ready(function () {
    let table;
    fetch('./assets/estandares/wcag-22.json')
      .then(response => response.json())
      .then(data => {

        const pautas = [];

        data.principles.forEach(principio  => {
          principio.guidelines.forEach(pauta  => {
            pautas.push({
              pauta: pauta,
              principio: principio
            });
          });
        });

        table = $('#table').DataTable({
          info: false,
          paging: false,
          ordering: false,
          order: [[0, 'asc']],
          dom: '<"row" <"col-sm-12" t> >',
          data: pautas,
          columns: [
            { data: 'pauta.num' },
            { data: 'pauta.handle' },
            { data: 'pauta.content', }
          ]
        });

      })
      .catch(error => {
        console.error('Error cargando WCAG:', error);
      });
  });
</script>
